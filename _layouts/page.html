---
layout: default
---
<article class="post-single">
  {% if page.title %}
  <header class="page-header"><h1>{{ page.title }}</h1>{% if page.description %}<div class="post-description">{{ page.description }}</div>{% endif %}</header>
  {% endif %}
  <div class="{% if page.prose %}post-content{% else %}page-content{% endif %}">{{ content }}</div>
</article>
