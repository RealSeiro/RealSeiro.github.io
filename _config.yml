title: Dohyun Kim
description: AI undergraduate at Gachon University. I build things to find out how models can learn from their own experience.
author:
  name: Dohyun Kim
  photo: /assets/img/profile.jpg
  github: RealSeiro
  email:  suwonkim12345@gmail.com    # e.g. you@example.com — leave empty to hide
  linkedin:   # the part after linkedin.com/in/, e.g. dohyun-kim — leave empty to hide
  scholar:    # full Google Scholar profile URL — leave empty to hide

# Visitor counts: sign up at goatcounter.com with the code below, then see stats at https://realseiro.goatcounter.com
goatcounter: realseiro

# Comments under posts and projects (stored as GitHub issues in this repo, via utterances)
comments: true

url: "https://realseiro.github.io"
baseurl: ""
lang: en
timezone: Asia/Seoul
future: true          # posts dated "today" in Korea are still "tomorrow" on the build server (UTC)


markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax   # $$...$$ becomes \(...\) / \[...\]; KaTeX renders it in the browser

collections:
  writing:              # blog posts — the filename can be anything (Obsidian names files after the title)
    output: true
    permalink: /posts/:slug/
    sort_by: date
  projects:
    output: true
    permalink: /projects/:slug/

feed:
  path: /feed/unused.xml   # Jekyll's built-in posts folder is unused; the real feed is below
  collections:
    writing:
      path: /feed.xml

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope: { path: "", type: writing }
    values: { layout: post, math: true, toc: true }
  - scope: { path: "", type: projects }
    values: { layout: project, math: true, toc: true }
  - scope: { path: "" }
    values: { layout: page }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
  - _templates
