title: Dohyun Kim
tagline: Notes on AI research — learning from experience, alignment, and what I'm building.
description: Research notes by Dohyun Kim, AI undergraduate at Gachon University.
author:
  name: Dohyun Kim
  github: RealSeiro
  email: # add if you want it shown

url: "https://realseiro.github.io"
baseurl: ""
lang: en
timezone: Asia/Seoul

permalink: /:year/:month/:title/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax   # turns $$...$$ into \(...\) / \[...\]; KaTeX renders it in the browser

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, math: true }
  - scope: { path: "" }
    values: { layout: page }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
