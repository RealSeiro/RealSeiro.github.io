title: Dohyun Kim
description: AI undergraduate at Gachon University. I build things to find out how models can learn from their own experience.
author:
  name: Dohyun Kim
  github: RealSeiro
  email:      # e.g. you@example.com — shown on the home page and About when filled in
  linkedin:   # e.g. dohyun-kim — leave empty to hide
  scholar:    # Google Scholar URL — leave empty to hide

url: "https://realseiro.github.io"
baseurl: ""
lang: en
timezone: Asia/Seoul

permalink: /posts/:year/:title/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax   # $$...$$ becomes \(...\) / \[...\]; KaTeX renders it in the browser

collections:
  projects:
    output: true
    permalink: /projects/:name/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, math: true, toc: true }
  - scope: { path: "", type: projects }
    values: { layout: project, math: true, toc: true }
  - scope: { path: "" }
    values: { layout: page }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
