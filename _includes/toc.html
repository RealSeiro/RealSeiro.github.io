<details class="toc" id="toc" hidden>
  <summary><span class="title">Table of Contents</span></summary>
  <div class="inner"><ul id="toc-list"></ul></div>
</details>
<script>
  (function () {
    var heads = document.querySelectorAll(".post-content h2[id], .post-content h3[id]");
    if (heads.length < 4) return;   // short pages don't need a table of contents
    var list = document.getElementById("toc-list"), parent = list;
    heads.forEach(function (h) {
      var li = document.createElement("li"), a = document.createElement("a");
      a.href = "#" + h.id; a.textContent = h.textContent;
      li.appendChild(a);
      if (h.tagName === "H2") { list.appendChild(li); parent = li; }
      else {
        var sub = parent === list ? list : (parent.querySelector("ul") || parent.appendChild(document.createElement("ul")));
        sub.appendChild(li);
      }
    });
    var toc = document.getElementById("toc"), body = document.querySelector(".post-content");
    body.parentNode.insertBefore(toc, body);   // sits above the article text
    toc.hidden = false;
  })();
</script>
